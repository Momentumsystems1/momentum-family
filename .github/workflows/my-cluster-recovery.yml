name: My Cluster recovery checks
on:
  push:
    branches:
      - recovery/my-cluster-core-20261013
      - feature/baymove-functional-circle-20261014
      - feature/baymove-unified-map-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q backend
      - name: Install portable backend requirements
        run: python -m pip install -r backend/requirements-core.txt
      - name: Import API without production services
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: my_cluster_ci
          JWT_SECRET: test-only-not-a-real-secret-my-cluster-ci
          ACCESS_MINUTES: '20'
          REFRESH_DAYS: '30'
          APP_PUBLIC_URL: http://127.0.0.1:8081
          TERMS_VERSION: '2026-06-01'
        run: python -c "from server import app; assert app.title == 'Sentinel Family API'; print('Backend imports successfully')"


  baymove-real-circle:
    name: BAYMOVE real-circle integration (temporary MongoDB)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install backend requirements (no private services)
        run: python -m pip install -r backend/requirements-core.txt
      - name: Exercise real registration, circle, invitations, privacy and check-in
        working-directory: backend
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: baymove_disposable_ci
          JWT_SECRET: test-only-ci-not-for-production-baymove-2026
          ACCESS_MINUTES: '20'
          REFRESH_DAYS: '30'
          APP_PUBLIC_URL: https://baymove-preview.invalid
          TERMS_VERSION: '2026-06-01'
        run: python -m tests.vertical_slice_ci

  frontend-typecheck:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install compatible Yarn
        run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - name: Restore frontend dependencies
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
      - name: Validate native Expo configuration (no keys exposed)
        run: npx expo config --json > /dev/null
      - name: Check TypeScript
        run: yarn tsc --noEmit
      - name: Compile Expo web preview
        run: npx expo export -p web
